<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSUD Studio — 3D Adventure Example</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="ui">
    <div class="hud">
      <div class="logo">PSUD <span>3D ADVENTURE</span></div>
      <div class="stats">
        <span id="score">Score: 0</span>
        <span id="coins">Coins: 0</span>
        <span id="lives">Lives: 3</span>
      </div>
    </div>
    <div id="canvas-wrap">
      <canvas id="game"></canvas>
    </div>
    <div id="overlay" class="overlay">
      <div class="panel">
        <h1>3D Adventure</h1>
        <p>A complete 3D platformer example with a fully lit scene, shadows, and a controllable 3D character.</p>
        <div class="controls">
          <div><kbd>A</kbd> / <kbd>←</kbd> Move Left</div>
          <div><kbd>D</kbd> / <kbd>→</kbd> Move Right</div>
          <div><kbd>W</kbd> / <kbd>↑</kbd> Move Forward</div>
          <div><kbd>S</kbd> / <kbd>↓</kbd> Move Back</div>
          <div><kbd>Space</kbd> Jump</div>
          <div><kbd>R</kbd> Restart</div>
        </div>
        <button id="startBtn">Play</button>
      </div>
    </div>
    <div id="gameover" class="overlay hidden">
      <div class="panel">
        <h1 id="endTitle">Game Over</h1>
        <p id="endScore">Score: 0</p>
        <button id="restartBtn">Play Again</button>
      </div>
    </div>
  </div>
  <script src="three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
