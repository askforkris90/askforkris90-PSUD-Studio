<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="40%" stop-color="#4da6ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <!-- Inner fill gradient -->
    <linearGradient id="innerGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0.15"/>
    </linearGradient>
    <!-- Core gradient -->
    <radialGradient id="coreGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#a0f0ff"/>
      <stop offset="40%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </radialGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Outer ambient glow -->
    <filter id="ambient" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <polygon points="256,40 440,148 440,364 256,472 72,364 72,148"
           fill="url(#mainGrad)" opacity="0.12" filter="url(#ambient)"/>

  <!-- Outer hexagon ring -->
  <polygon points="256,48 432,152 432,360 256,464 80,360 80,152"
           fill="none"
           stroke="url(#mainGrad)"
           stroke-width="6"
           filter="url(#glow)"
           stroke-linejoin="round"/>

  <!-- Mid hexagon ring -->
  <polygon points="256,88 396,172 396,340 256,424 116,340 116,172"
           fill="none"
           stroke="url(#mainGrad)"
           stroke-width="2.5"
           opacity="0.5"
           stroke-linejoin="round"/>

  <!-- Inner filled hexagon -->
  <polygon points="256,120 368,188 368,324 256,392 144,324 144,188"
           fill="url(#innerGrad)"
           stroke="url(#mainGrad)"
           stroke-width="1.5"
           opacity="0.9"
           stroke-linejoin="round"/>

  <!-- Inner geometric triangle accents -->
  <polygon points="256,150 340,200 340,312 256,362 172,312 172,200"
           fill="none"
           stroke="url(#mainGrad)"
           stroke-width="1.5"
           opacity="0.4"
           stroke-linejoin="round"/>

  <!-- Core outer ring -->
  <circle cx="256" cy="256" r="52"
          fill="none"
          stroke="url(#mainGrad)"
          stroke-width="3"
          filter="url(#softGlow)"
          opacity="0.8"/>

  <!-- Core filled circle -->
  <circle cx="256" cy="256" r="38"
          fill="url(#coreGrad)"
          filter="url(#glow)"/>

  <!-- Core inner dark -->
  <circle cx="256" cy="256" r="18"
          fill="#060a14"
          opacity="0.85"/>

  <!-- Core center point -->
  <circle cx="256" cy="256" r="8"
          fill="url(#coreGrad)"
          filter="url(#softGlow)"/>

  <!-- Accent lines (top vertex) -->
  <line x1="256" y1="48" x2="256" y2="100"
        stroke="url(#mainGrad)" stroke-width="2" opacity="0.6"/>
  <!-- Bottom -->
  <line x1="256" y1="412" x2="256" y2="464"
        stroke="url(#mainGrad)" stroke-width="2" opacity="0.6"/>
</svg>
